<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鲸鱼画卷 · 启动动画预览</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        /* The real welcome window is 600x700. The preview frames that exactly. */
        place-items: center;
        background: #0f1115;
        font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
      }
      .frame {
        position: relative;
        width: 600px;
        height: 700px;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        background: #eef4ff;
      }
      canvas { display: block; width: 100%; height: 100%; }
      .hud {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(20, 24, 34, 0.85);
        color: #e8eefc;
        backdrop-filter: blur(6px);
        z-index: 10;
      }
      .hud button {
        padding: 4px 10px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .hud button:hover { background: rgba(255, 255, 255, 0.18); }
      .hud code { color: #93c5fd; }
    </style>
  </head>
  <body>
    <div class="hud">
      <button id="replay">重播</button>
      <button id="theme">切换深/浅色</button>
      <span>进度 <code id="t">0.00</code></span>
    </div>
    <div class="frame"><canvas id="stage"></canvas></div>
    <script type="module">
      import { WhaleSplash } from './whale-animation.js'

      const canvas = document.getElementById('stage')
      const tLabel = document.getElementById('t')
      let splash

      function run() {
        splash?.stop()
        splash = new WhaleSplash(canvas, {
          durationMs: 4200,
          onPendant: () => { tLabel.textContent = 'pendant' },
        })
        // Report progress for the HUD without touching the engine's own loop.
        const started = performance.now()
        const tick = () => {
          const t = Math.min(1, (performance.now() - started) / 4200)
          tLabel.textContent = t.toFixed(2)
          if (t < 1) requestAnimationFrame(tick)
        }
        requestAnimationFrame(tick)
        splash.start()
      }

      document.getElementById('replay').addEventListener('click', run)
      document.getElementById('theme').addEventListener('click', () => {
        document.body.toggleAttribute('data-ds-dark-theme')
        document.querySelector('.frame').style.background =
          document.body.hasAttribute('data-ds-dark-theme') ? '#0b1220' : '#eef4ff'
      })
      run()
      // Expose for scripted frame capture during verification.
      window.__splash = () => splash
    </script>
  </body>
</html>
