<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
    <title></title>
    <link rel="stylesheet" href="../lib/welcome/brand-font.css">
    <link rel="stylesheet" href="../lib/welcome/welcome.css">
    <link rel="stylesheet" href="welcome.css">
    <link rel="stylesheet" href="whale.css">
    <script src="../lib/welcome/whale-animation.js" defer></script>
    <script src="whale-splash.js" defer></script>
    <script src="../lib/welcome/welcome.js" defer></script>
  </head>
  <body>
    <!--
      The whale splash renders into this canvas and then hands control back to the
      welcome UI: the original React app mounts into #root, and the canvas fades
      out underneath it once the charm has settled.

      Both `defer` scripts above run in document order, so the splash controller
      (whale-splash.js) is set up before the bundled welcome app (welcome.js).
      Keep welcome.js, welcome.css and the CSP's `font-src 'self'`: the original
      page loaded them, and dropping any of them leaves the sign-in window blank
      or unstyled without a single console error that points back here.
    -->
    <canvas id="whale-stage" aria-hidden="true"></canvas>
    <div id="root"></div>
  </body>
</html>
