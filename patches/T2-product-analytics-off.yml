# ── deepseek-up-T · T2 能力扩展 ── 关闭桌面端产品埋点（product-analytics）
#
# 这份声明**尚未应用**。它是给用户的一个已验证开关：默认不落盘，因为
# 「要不要上报」是用户的选择，不是工程判断。
#
# 为什么值得写成一份声明：
#   `@deepseek-ai/dsh-client-product-analytics` 的 README.zh.md 原文——
#   「桌面端默认通过现有 OTel 产品导出器上报指定交互，**不提供用户操作入口**」，
#   并且 `product-analytics` settings 命名空间的 `enabled` **默认 true**。
#   也就是说：现场组合里
#       - id: product-analytics
#         name: '@deepseek-ai/dsh-client-product-analytics'
#         config:
#           enabled: true
#   是开着的，而界面上没有开关。本项目能改它，是因为它只是一个普通配置行。
#
# 上报什么（README 原文摘要）：
#   公共字段 device_id / user_id / os_version / app_version；事件包括欢迎页曝光、
#   消息提交（msg_type / 模型 / 显式思考强度 / run_mode）、模型与思考强度切换、
#   插件开关与插件安装结果、会话分叉。
#   **API key、账户令牌、提示词和模型回复都不是事件字段**；缺失值省略。
#   普通 Web 客户端不上报这些事件；采集不修改模型请求（KV Cache 无影响）。
#
# 为什么必须把 appVersion 也写出来：
#   patch 是**按 id 整体替换该行的 config**（不是深合并）。现场那一行的 config 是
#   { enabled: true, appVersion: !!js process.env.DSH_CLIENT_VERSION }，
#   只写 enabled 会把 appVersion 一起抹掉。要改整体，就得把整体写全。
#
# 关掉会发生什么、不会发生什么：
#   关闭后不读取埋点身份、不接收新事件；但**导出器仍然挂载**，已入队的事件
#   仍可能被导出（README 明说「关闭只停止新采集，不清空导出器队列」）。
#   会话反馈遥测（- id: session-telemetry-otel，mode FEEDBACK_ONLY）是**独立策略**，
#   本声明不影响它：它只在用户显式提交反馈后才导出。
#   整进程一键退出另有环境变量通道：DSH_TELEMETRY_DISABLED 只要非空（含 '0'、'false'）
#   就让进程退出遥测——但它需要改启动方式，而本声明只改配置。
#
# 怎么应用（改之前先快照；改完必须重启 DSH 才生效，cordis.patch.yml 无热重载）：
#   1) node src/cli.mjs snapshot create -m "T2 关闭产品埋点 改动前"
#   2) node src/cli.mjs precheck --patch patches/T2-product-analytics-off.yml
#   3) 把下面这三行（含 config）追加到 $DSH_HOME/profiles/desktop/cordis.patch.yml 末尾
#   4) node src/cli.mjs precheck     # 现场预检必须 0 问题
#   5) node src/cli.mjs baseline write
# 怎么撤：node src/cli.mjs snapshot restore <步骤 1 的快照 id>

- id: product-analytics
  name: '@deepseek-ai/dsh-client-product-analytics'
  config:
    enabled: false
    appVersion: !!js process.env.DSH_CLIENT_VERSION
