# patches/T1-whale-splash.yml
#
# T1（外观与体验）的第一次 L3 改造声明。
# 状态：2026-10-09 现场已安装的是早先 13 条目版本；本次星海 3D 鲸鱼改造含 14 条目，
#   目前仅在源码与暂存构建中，尚未写入正在使用的 app.asar。
#
# 素材分两类（这一点决定了「一份全新 clone 能不能构建」）：
#   · **本项目手写的素材**在 `vendor/whale/materials/`（welcome/pendant 两页、动画模块源、挂件 preload），
#     已入库 —— 它们是手写的，丢了就重新写吧。
#   · **`action: patch` 的原版素材**（下面三条 `../../.probe/*`）是**从原版归档抽出来的上游原文**，
#     不入库（体积大、且属于安装包内容）：它们可以从任何一份原版 app.asar 原样重抽
#     （`node vendor/asar/list.mjs --get <归档内路径> <目标>`），而且构建时会逐字节校验
#     它们与 `--from` 归档是否一致 —— 不一致就报错（见 build.mjs 里那句「原版素材与归档不一致」）。
#     注意：落盘后**别从已改造的安装包里重抽**（那里面躺着的是打过补丁的代码）——
#     无升级时从 app.asar.whale-backup 抽，真实升级后才从新安装包抽。
#
# 执行器：vendor/whale/build.mjs（构建）+ vendor/whale/install.mjs（落盘/回滚）
# 两者都从这个文件读 verify.expect_diff_entries 与 target.entries，
# 声明与实际差异不一致就报错退出（见 vendor/lib/harness.mjs 的 readPatchDecl）。

id: T1-whale-splash
name: 启动窗口画卷鲸鱼动画 + 桌面挂件 + 视觉模型自动路由
track: T1

target:
  archive: resources/app.asar
  entries:
    # ── 改动的既有条目（4 个）──
    - path: renderer/welcome.html
      action: replace              # 换成带画卷/鲸鱼容器的版本
      source: ../vendor/whale/materials/renderer/welcome.html
    - path: lib/main.js
      action: patch                # 锚点替换：挂件窗口的创建与生命周期
      source: ../../.probe/main.js
      patcher: vendor/whale/patch-main.mjs
    - path: lib/preload-app.cjs
      action: patch                # 锚点替换：挂件的 IPC 桥
      source: ../../.probe/preload-app.cjs
      patcher: vendor/whale/patch-preload.mjs
    - path: dsh/node_modules/@deepseek-ai/dsh-api-session-controller/lib/index.js
      action: patch                # 锚点替换：按模型能力自动路由视觉请求
      source: ../../.probe/session-controller.js
      patcher: vendor/whale/patch-session-controller.mjs

    # ── 新增条目（10 个）──
    - path: renderer/whale.css
      action: insert
      source: ../vendor/whale/materials/renderer/whale.css
    - path: renderer/whale-splash.js
      action: insert
      source: ../vendor/whale/materials/renderer/whale-splash.js
    - path: renderer/replay.html
      action: insert
      source: ../vendor/whale/materials/renderer/replay.html   # 挂件菜单「Replay animation」用的短命窗口
    - path: renderer/replay.js
      action: insert
      source: ../vendor/whale/materials/renderer/replay.js
    - path: renderer/pendant.html
      action: insert
      source: ../vendor/whale/materials/renderer/pendant.html
    - path: renderer/pendant.css
      action: insert
      source: ../vendor/whale/materials/renderer/pendant.css
    - path: renderer/pendant.js
      action: insert
      source: ../vendor/whale/materials/renderer/pendant.js
    - path: lib/preload-charm.cjs
      action: insert
      source: ../vendor/whale/materials/lib/preload-charm.cjs
    - path: lib/welcome/whale-animation.js
      action: insert
      source: ../vendor/whale/materials/whale-animation.js      # 经 bundle 成经典脚本（CSP 不允许 ESM）
      bundler: vendor/whale/bundle.mjs
    - path: lib/welcome/whale-3d.png
      action: insert
      source: ../vendor/whale/materials/whale-3d.png             # 用户指定原始透明星光鲸鱼；纹理与降级共用

verify:
  expect_diff_entries: 14
  syntax_check:
    - lib/welcome/whale-animation.js
    - renderer/whale-splash.js
    - renderer/replay.js
    - renderer/pendant.js
    - lib/main.js
    - lib/preload-app.cjs
    - lib/preload-charm.cjs
    - dsh/node_modules/@deepseek-ai/dsh-api-session-controller/lib/index.js

rollback:
  - node vendor/whale/install.mjs --rollback

notes: |
  为什么改：启动界面只有静态 logo，没有品牌感；用户希望有一个可拖拽的桌面挂件。

  已知限制：
  1. Harness 升级会整体覆盖 app.asar，本次改造需要重新落盘（见 T5 的升级检测待办）。
  2. 启动窗口有严格 CSP，动画模块必须打成经典脚本，不能用 ESM。
  3. 鲸鱼必须保留用户提供的原图。WebGL2 使用原图纹理网格实现柔和的 2.5D 变形，
     不重建或替换鲸鱼造型；脚本内嵌同一 PNG 字节以支持本地文件纹理。无 WebGL2 时直接绘制原图。
